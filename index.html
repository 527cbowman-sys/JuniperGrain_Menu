<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu | Juniper & Grain</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="hero">
        <img src="img/logo.png" alt="Juniper & Grain logo" class="logo">

        <h1>Our Menu</h1>
        <div class="hero-decoration"></div>
    </header>

    <main>

        <section class="menu-intro">
            <p class="section-label">EXPLORE OUR SELECTION</p>
            <h2>Something delicious awaits.</h2>
        </section>

        <nav id="filters" aria-label="Filter menu categories"></nav>

        <p id="status" role="status"></p>

        <section id="menu"></section>

    </main>

    <footer>
        <p>JUNIPER & GRAIN</p>
        <span>Good food. Good company. Good moments.</span>
    </footer>

</body>
</html>
